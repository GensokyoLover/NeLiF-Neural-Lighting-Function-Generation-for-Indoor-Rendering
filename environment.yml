name: nelif
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # CUDA 12.6 build for Windows/Linux with an NVIDIA GPU.
      # See https://pytorch.org/get-started/previous-versions/ for other builds.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.6.0+cu126
      # Released scene/light pickle files require NumPy 2.x.
      - numpy==2.2.5
      - pyexr==0.5.0
      - zstandard==0.23.0
      - imageio==2.37.0
      - tqdm==4.66.4
